[project]
name = "sequoia-x"
version = "3.1.0"
requires-python = ">=3.10"
dependencies = [
    "baostock>=0.9",
    # 仅用于股票名称列表（client.stocks()，走 TDX 的证券列表接口，仍可用）；
    # K 线接口已被 TDX 服务端拒绝，行情数据源见 sequoia_x/data/sina_quote.py
    "mootdx>=0.7",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "requests>=2.31",
    "scipy>=1.10",
    "cos-python-sdk-v5>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "pytest-mock>=3.12",
]
# akshare：sequoia_x/ 主包已无引用，但 fund_research/analysis/screener.py 仍在用，
# 所以这个 extra 保留（别当成死配置删掉）。
factors = [
    "akshare>=1.18",
]
financial = [
    "efinance>=0.5",
]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
