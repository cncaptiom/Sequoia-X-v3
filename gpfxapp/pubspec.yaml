name: gpfxapp
description: 股票分析APP - 技术分析量化策略工具
publish_to: 'none'
version: 1.2.0+3

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter

  # 状态管理
  provider: ^6.1.1

  # 网络请求
  dio: ^5.4.0

  # 本地存储
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # COS 密钥等敏感凭证（Android Keystore / iOS Keychain）
  flutter_secure_storage: ^9.2.2

  # 图表
  fl_chart: ^0.70.0

  # 通知
  flutter_local_notifications: ^17.2.1

  # 工具
  intl: ^0.19.0

  # 编码转换（腾讯API使用GBK编码）
  enough_convert: ^1.6.0

  # COS 签名认证
  crypto: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
  build_runner: ^2.4.6
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
